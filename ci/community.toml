# Rules for community kernels, read by `scripts/check_wrapping.py --community` (and so by
# the validate stage of the pull request CI). See docs/COMMUNITY_POLICY.md.

# The Hugging Face organisation every community kernel publishes to: build.toml's
# repo-id must be "<hub-org>/<kernel directory name>". Proposed, not yet agreed with
# Hugging Face. The publish workflow can write to another organisation instead (its
# hub_org input replaces the organisation, never the name).
hub-org = "rocm-community"

# Names and organisations reserved for AMD's own packages, which are published from
# ROCm/aiter.
reserved-prefixes = ["aiter"]
reserved-orgs = ["amd", "amd-aiter"]

# Every kernel's CARD.md (or README.md) must carry this notice; see
# docs/CARD_TEMPLATE_COMMUNITY.md.
card-notice = "not supported by AMD"

# The GPUs CI tests on, and the runner (its runs-on label) for each. A kernel is
# tested on, and its pull requests gated by, each GPU in its rocm-archs listed here;
# at least one must be. Adding hardware is a line here (see ci/README.md for what a
# runner needs). Kept in the repository: pull requests from forks don't get the
# repository's variables.
[ci-runners]
gfx950 = "linux-rck-mi350-1"
