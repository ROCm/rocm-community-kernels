#
# Builds the CI image (ci/docker/Dockerfile) and pushes it to the GitHub Container
# Registry as ghcr.io/<owner>/rocm-community-kernels-ci, logged in with this job's
# own temporary GITHUB_TOKEN: there is no registry key to create or store. Pull
# requests only build it. Every push is tagged sha-<commit>; only main (and, until the
# CI is merged into main, ci_setup, which also only takes reviewed pull requests) also
# pushes `latest`, the tag the GPU jobs run (rocm-build-test.yml), so they only ever
# use an image built from reviewed code. A push to another branch gives an image to
# try on the MI350 before merging, by its sha- tag. The package must be public so the
# MI350 runners can pull it without credentials (it contains nothing private).

name: CI image

on:
  push:
    paths:
      - "ci/docker/**"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - "ci/docker/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions: {}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/rocm-community-kernels-ci"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build ci/docker -t "$image:sha-$SHA" --build-arg "REVISION=$SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA"

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:sha-$SHA"
          tags="sha-$SHA"
          # ci_setup: until the CI is merged into main (see the header).
          if [ "$REF" = refs/heads/main ] || [ "$REF" = refs/heads/ci_setup ]; then
            docker tag "$IMAGE:sha-$SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
            tags="$tags, latest (what the GPU jobs run)"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHA")
          docker logout ghcr.io
          {
            echo "### CI image pushed"
            echo "Tags: $tags"
            echo '```'
            echo "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
