#
# Unit tests for the CI's own scripts (scripts/ and ci/). They need no GPU, Nix or
# network; the tests that run the real `kernels` loader install CPU PyTorch and
# `kernels` here.

name: CI scripts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "ci/**"
      - "build-concurrency.json"
      - ".github/workflows/ci-scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "ci/**"
      - "build-concurrency.json"
      - ".github/workflows/ci-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test CI scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install kernels numpy pytest

      - name: Run tests
        run: python -m pytest scripts/tests -q -W ignore::UserWarning
