name: Repository Bootstrap

# Runs once in repositories generated from this template.
#
# On the first push to the default branch it:
#   1. Generates README.md from templates/README.template.md
#   2. Substitutes placeholders (repo name, owner, year; leaves human fields as TODO)
#   3. Removes template-only scaffolding (templates/)
#   4. Deletes itself so it can never run again
#   5. Commits and pushes the result
#
# Required repo layout in the TEMPLATE repository:
#   README.md                         -> the template's OWN usage docs (overwritten in new repos)
#   templates/README.template.md      -> the seed README new repos receive (with {{PLACEHOLDERS}})
#   .github/workflows/template-init.yml -> this file
#
# IMPORTANT: replace 'ROCm/rocm-repo-template' below with this template's full name.
# That guard is what stops the workflow from running in the template repo itself.
# (env context is not available in a job-level `if:`, so the name is hardcoded here.)

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.repository }}
  cancel-in-progress: true

jobs:
  bootstrap:
    # Never run on the template repo itself.
    if: github.repository != 'ROCm/rocm-repo-template'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository # zizmor: ignore[artipacked]
        # Checkout credentials remain available for the final authenticated push.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine whether bootstrap is needed
        id: guard
        shell: bash
        run: |
          if [ -f templates/README.template.md ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No templates/README.template.md found — already bootstrapped. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate README from template
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          YEAR="$(date +%Y)"

          cp templates/README.template.md README.md

          # Auto-derivable values.
          sed -i \
            -e "s|{{PROJECT_NAME}}|${NAME}|g" \
            -e "s|{{REPOSITORY_NAME}}|${NAME}|g" \
            -e "s|{{OWNER}}|${OWNER}|g" \
            -e "s|{{YEAR}}|${YEAR}|g" \
            README.md

          # Human-supplied fields left as visible TODOs for the new maintainer.
          sed -i \
            -e "s|{{DESCRIPTION}}|TODO: Add a one-line project description|g" \
            -e "s|{{MAINTAINERS}}|TODO: Add maintainers|g" \
            README.md

      - name: Remove template-only files
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf templates
          rm -f .github/workflows/template-init.yml

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: initialize repository from template"
            git push
          fi
